[package]
name = "im-api"
version = "0.1.0"
license = "MIT"
edition = "2024"
rust-version = "1.91"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
multibase = "0.9"
subtle = "2.6"
libp2p-identity = { version = "=0.2.12", features = ["ed25519", "peerid"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "fs", "set-header"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "=0.8.7"
tokio = { version = "1", default-features = false, features = ["sync"] }
futures-util = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sha2 = "0.10"
futures-util = "0.3"
tokio-tungstenite = "0.29"

[profile.release]
lto = "thin"
codegen-units = 16
strip = true

# wasm-bindgen needs the Wasm target_features section to generate panic recovery bindings.
[profile.worker]
inherits = "release"
strip = "debuginfo"
