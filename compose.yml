name: ky

services:
  im:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RELEASE_VERSION: ${RELEASE_VERSION:-0.1.0}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        VITE_PEER_CHECK_INTERVAL_MS: ${VITE_PEER_CHECK_INTERVAL_MS:-10000}
        VITE_ROOM: ${VITE_ROOM:-local}
        VITE_ICE_SERVERS: ${VITE_ICE_SERVERS-stun:stun.miwifi.com:3478,stun:stun.chat.bilibili.com:3478,stun:stun.cloudflare.com:3478,stun:stun.l.google.com:19302}
        VITE_SIGNAL_URL: ${VITE_SIGNAL_URL:-}
        VITE_API_LATEST: ${VITE_API_LATEST:-/api/latest}
        VITE_API_AUTH: ${VITE_API_AUTH:-}
        VITE_WEB_URL: ${VITE_WEB_URL:-https://im.kuangye.team/}
        VITE_CLIENT_DOWNLOAD_URL: ${VITE_CLIENT_DOWNLOAD_URL:-https://github.com/kuangye-team/ky-im/releases/latest}
        VITE_RTC_MAX_MESSAGE_SIZE: ${VITE_RTC_MAX_MESSAGE_SIZE:-65536}
        VITE_RTC_MAX_BUFFERED_AMOUNT: ${VITE_RTC_MAX_BUFFERED_AMOUNT:-1048576}
        VITE_RTC_BUFFERED_AMOUNT_LOW_THRESHOLD: ${VITE_RTC_BUFFERED_AMOUNT_LOW_THRESHOLD:-262144}
        VITE_RTC_FILE_CHUNK_SIZE: ${VITE_RTC_FILE_CHUNK_SIZE:-262144}
        VITE_STORAGE_CHUNK_SIZE: ${VITE_STORAGE_CHUNK_SIZE:-2097152}
        VITE_SHOW_TRANSFER_SPEED: ${VITE_SHOW_TRANSFER_SPEED:-true}
    env_file:
      - path: ./api/.env.compose
        required: false
    ports:
      - "${SERVER_PORT:-8080}:8080"
    restart: unless-stopped
