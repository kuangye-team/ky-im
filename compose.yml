name: ky

services:
  im:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        VITE_ROOM: ${VITE_ROOM:-local}
        VITE_SIGNAL_URL: ${VITE_SIGNAL_URL:-}
        VITE_API_AUTH: ${VITE_API_AUTH:-}
        VITE_WEB_URL: ${VITE_WEB_URL:-https://im.kuangye.team/}
        VITE_CLIENT_DOWNLOAD_URL: ${VITE_CLIENT_DOWNLOAD_URL:-https://github.com/kuangye-team/ky-im/releases/latest}
        VITE_STORAGE_CHUNK_SIZE: ${VITE_STORAGE_CHUNK_SIZE:-2097152}
    env_file:
      - path: ./api/.env.compose
        required: false
    ports:
      - "${SERVER_PORT:-8080}:8080"
    restart: unless-stopped
