[package]
name = "hummingbird"
version = "0.1.0"
description = "Hummingbird local network messenger"
license = "MIT"
edition = "2024"
rust-version = "1.91"

[dev-dependencies]
turn = "=0.17.3"
webrtc-util = { version = "=0.17.3", default-features = false, features = ["vnet"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
mdns-sd = "0.21"
libp2p = { version = "=0.57.1", features = ["tokio", "tcp", "quic", "noise", "yamux", "identify", "macros"] }
futures = "0.3"
wtransport = "0.7.2"
if-watch = { version = "3.2", features = ["tokio"] }
if-addrs = "0.15"
async-stream = "0.3"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt", "compat"] }
mime_guess = "2.0.5"
tempfile = "3.27.0"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 16
strip = true

[profile.dev.package."*"]
opt-level = 3
